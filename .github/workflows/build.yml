name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin pkg-config \
            build-essential git zip unzip openjdk-17-jdk \
            libffi-dev libssl-dev zlib1g-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev

      - name: Install Buildozer and Cython
        run: pip install --upgrade "buildozer==1.5.0" cython

      - name: Remove outdated reportlab recipe (avoid broken C accelerator build)
        run: |
          python -c "
          import pythonforandroid, os, shutil
          recipe_dir = os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes', 'reportlab')
          if os.path.isdir(recipe_dir):
              shutil.rmtree(recipe_dir)
              print('Removed outdated recipe at', recipe_dir)
          else:
              print('No reportlab recipe found at', recipe_dir, '(already absent, nothing to do)')
          "

      - name: Build the APK
        run: yes | buildozer -v android debug

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
