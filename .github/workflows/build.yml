name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /home/runner/android-sdk
      ANDROIDNDK: /home/runner/android-sdk/ndk/28.0.13004108
      ANDROIDAPI: "35"
      NDKAPI: "24"
      ANDROIDNDKVER: "28c"

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 3. Python 3.11.7
      # --------------------------------------------------
      - name: Set up Python 3.11.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"


      # --------------------------------------------------
      # 4. Install Linux dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # --------------------------------------------------
      # 5. Install Python build tools
      # --------------------------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade \
            buildozer \
            cython==0.29.37


      # --------------------------------------------------
      # 6. Install Android SDK
      # --------------------------------------------------
      - name: Install Android SDK
        run: |
          set -e

          SDK_ROOT="/home/runner/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"


      # --------------------------------------------------
      # 7. Verify Android SDK
      # --------------------------------------------------
      - name: Verify Android SDK
        run: |
          set -e

          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"

          echo ""
          echo "SDK directory:"
          ls -lah "$ANDROIDSDK"

          echo ""
          echo "Build-tools:"
          ls -lah "$ANDROIDSDK/build-tools"

          echo ""
          echo "AIDL:"
          find "$ANDROIDSDK/build-tools" -name aidl -type f -print

          echo ""
          echo "NDK:"
          ls -lah "$ANDROIDNDK"

          echo ""
          echo "SDK packages:"
          sdkmanager --sdk_root="$ANDROIDSDK" --list_installed | head -100


      # --------------------------------------------------
      # 8. Force Buildozer to use the SAME SDK
      # --------------------------------------------------
      - name: Configure Buildozer Android paths
        run: |
          set -e

          mkdir -p /home/runner/.buildozer/android/platform

          rm -rf /home/runner/.buildozer/android/platform/android-sdk

          ln -s \
            /home/runner/android-sdk \
            /home/runner/.buildozer/android/platform/android-sdk

          echo "Buildozer SDK link:"
          ls -lah /home/runner/.buildozer/android/platform/

          echo ""
          echo "Resolved SDK path:"
          readlink -f /home/runner/.buildozer/android/platform/android-sdk

          echo ""
          echo "AIDL through Buildozer path:"
          find \
            /home/runner/.buildozer/android/platform/android-sdk/build-tools \
            -name aidl \
            -type f \
            -print


      # --------------------------------------------------
      # 9. Clean old Buildozer state
      # --------------------------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p /home/runner/.buildozer/android/platform

          ln -s \
            /home/runner/android-sdk \
            /home/runner/.buildozer/android/platform/android-sdk


      # --------------------------------------------------
      # 10. Final environment check
      # --------------------------------------------------
      - name: Final Android environment check
        run: |
          set -e

          echo "========================================"
          echo "ANDROIDSDK"
          echo "========================================"
          echo "$ANDROIDSDK"

          echo ""
          echo "========================================"
          echo "ANDROIDNDK"
          echo "========================================"
          echo "$ANDROIDNDK"

          echo ""
          echo "========================================"
          echo "SDK BUILD TOOLS"
          echo "========================================"
          ls -lah "$ANDROIDSDK/build-tools/35.0.0"

          echo ""
          echo "========================================"
          echo "AIDL"
          echo "========================================"
          "$ANDROIDSDK/build-tools/35.0.0/aidl" --version

          echo ""
          echo "========================================"
          echo "NDK"
          echo "========================================"
          cat "$ANDROIDNDK/source.properties"


      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          set -e

          export ANDROIDSDK="/home/runner/android-sdk"
          export ANDROIDNDK="/home/runner/android-sdk/ndk/28.0.13004108"
          export ANDROIDAPI="35"
          export NDKAPI="24"
          export ANDROIDNDKVER="28c"

          buildozer android debug


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Resume-Builder-APK
          path: bin/*.apk
          if-no-files-found: error
