name: Build Resume Builder APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build-apk:
runs-on: ubuntu-22.04

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Verify Java
    run: |
      java -version
      javac -version

  - name: Set up Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: pip

  - name: Verify Python
    run: |
      python --version
      python -m pip --version

  - name: Install Python build dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install setuptools wheel
      python -m pip install buildozer==1.6.0 cython==0.29.33

  - name: Install Android SDK command line tools
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
    run: |
      yes | sdkmanager --licenses > /dev/null || true

  - name: Install Android SDK packages
    run: |
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-34"
      sdkmanager "build-tools;34.0.0"

  - name: Verify Android SDK
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      which sdkmanager
      sdkmanager --version
      adb version

  - name: Verify project files
    run: |
      echo "Project files:"
      ls -la
      echo ""
      echo "Checking main.py:"
      test -f main.py
      echo ""
      echo "Checking buildozer.spec:"
      test -f buildozer.spec
      echo ""
      echo "Checking requirements.txt:"
      test -f requirements.txt

  - name: Install project requirements
    run: |
      python -m pip install -r requirements.txt

  - name: Build APK
    env:
      JAVA_HOME: ${{ env.JAVA_HOME }}
      ANDROID_HOME: ${{ env.ANDROID_HOME }}
      ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
    run: |
      buildozer android clean
      buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Resume-Builder-APK
      path: bin/*.apk
      if-no-files-found: error
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.37"

      - name: Install Python packages
        run: |
          python -m pip install "kivy==2.3.0"
          python -m pip install "kivymd==1.2.0"
          python -m pip install pillow
          python -m pip install "reportlab==4.0.9"

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          sdkmanager --version
          ls -la "$ANDROID_SDK_ROOT/build-tools"
          ls -la "$ANDROID_SDK_ROOT/platform-tools"
          ls -la "$ANDROID_SDK_ROOT/platforms"

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Check project files
        run: |
          echo "Project files:"
          ls -la
          echo "Buildozer spec:"
          test -f buildozer.spec
          echo "buildozer.spec found."

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
          if-no-files-found: error
