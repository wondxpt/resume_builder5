name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.7"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install buildozer==1.5.0
          python -m pip install python-for-android

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$HOME"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q commandlinetools-linux-13114758_latest.zip \
            -d android-sdk/cmdline-tools

          mv android-sdk/cmdline-tools/cmdline-tools \
            android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          which sdkmanager

          echo ""
          echo "AIDL:"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo ""
          echo "Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "Platform:"
          ls -lah "$ANDROID_HOME/platforms/android-35"

      - name: Check project
        run: |
          test -f main.py
          test -f buildozer.spec

          echo "main.py: OK"
          echo "buildozer.spec: OK"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          java -version
          python --version
          cython --version
          aidl --version

          buildozer android debug

      - name: Show APK
        if: success()
        run: |
          ls -lah bin

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
          if-no-files-found: error
