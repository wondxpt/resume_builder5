name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.7"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            tar \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Verify project
        run: |
          pwd
          ls -lah
          test -f main.py
          test -f buildozer.spec
          echo "main.py OK"
          echo "buildozer.spec OK"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.6.0"

      - name: Verify Python tools
        run: |
          python --version
          java -version
          cython --version
          buildozer --version

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      # Buildozer 1.6.0 still checks the old Android SDK tools/bin path.
      - name: Create Buildozer SDK compatibility paths
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin"

          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<'EOF'
          #!/bin/sh
          exec "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$@"
          EOF

          cat > "$ANDROID_HOME/tools/bin/avdmanager" <<'EOF'
          #!/bin/sh
          exec "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$@"
          EOF

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/avdmanager"

          echo "Compatibility sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Verify Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/37.0.0:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdkmanager:"
          command -v sdkmanager

          echo "Legacy sdkmanager path:"
          ls -lah "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "adb:"
          command -v adb

          echo "aidl:"
          command -v aidl

          echo "Installed build-tools:"
          ls -lah "$ANDROID_HOME/build-tools"

          echo "SDK verification successful."

      - name: Configure Buildozer SDK
        run: |
          if grep -qE '^#?android\.sdk_path[[:space:]]*=' buildozer.spec; then
            sed -i \
              's|^#\?android\.sdk_path[[:space:]]*=.*|android.sdk_path = /home/runner/android-sdk|' \
              buildozer.spec
          else
            printf '\nandroid.sdk_path = /home/runner/android-sdk\n' >> buildozer.spec
          fi

          if grep -qE '^#?android\.accept_sdk_license[[:space:]]*=' buildozer.spec; then
            sed -i \
              's|^#\?android\.accept_sdk_license[[:space:]]*=.*|android.accept_sdk_license = True|' \
              buildozer.spec
          else
            printf 'android.accept_sdk_license = True\n' >> buildozer.spec
          fi

          echo "Buildozer SDK configuration:"
          grep -E "android\.sdk_path|android\.accept_sdk_license" buildozer.spec

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Show final environment
        run: |
          echo "Java:"
          java -version

          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Buildozer SDK setting:"
          grep "android.sdk_path" buildozer.spec

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROIDSDK: /home/runner/android-sdk
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/37.0.0:$PATH"

          echo "Starting Buildozer..."
          buildozer -v android debug

      - name: Show APK
        if: success()
        run: |
          echo "APK files:"
          ls -lah bin

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
          if-no-files-found: error
