name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.7
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.7"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java and Python
        run: |
          java -version
          python --version
          python -m pip --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            tar \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "setuptools<70" \
            "wheel==0.43.0" \
            "Cython==0.29.36" \
            "buildozer==1.6.0" \
            "python-for-android==2024.1.21"

      - name: Verify project
        run: |
          echo "Working directory:"
          pwd

          echo "Project files:"
          ls -lah

          test -f main.py
          test -f buildozer.spec

          echo "main.py: OK"
          echo "buildozer.spec: OK"

      - name: Install Android command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$HOME"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d android-sdk/cmdline-tools

          mv \
            android-sdk/cmdline-tools/cmdline-tools \
            android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdkmanager:"
          command -v sdkmanager

          echo "AIDL:"
          command -v aidl

          echo "AIDL version:"
          aidl --version || true

          echo "Build tools:"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

      - name: Install Android NDK r25b
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager "ndk;25.2.9519653"

          test -d "$ANDROID_HOME/ndk/25.2.9519653"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Verify Buildozer configuration
        run: |
          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "Buildozer:"
          buildozer --version

          echo "python-for-android:"
          python -m pythonforandroid.toolchain --help >/dev/null

          echo "buildozer.spec:"
          grep -E "^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.ndk)" buildozer.spec || true

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          ANDROIDSDK: /home/runner/android-sdk
          ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.2.9519653
          ANDROIDNDK: /home/runner/android-sdk/ndk/25.2.9519653
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          echo "===== FINAL ENVIRONMENT ====="
          java -version
          python --version
          cython --version
          buildozer --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo "AIDL:"
          command -v aidl

          echo "===== START BUILD ====="

          buildozer -v android debug

      - name: Show APK
        if: success()
        run: |
          echo "APK files:"
          ls -lah bin

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
          if-no-files-found: error
