name: Build Resume Builder APK

on: [workflow_dispatch, push]

jobs:
build-apk:
runs-on: ubuntu-22.04

env:
  ANDROIDSDK: /home/runner/android-sdk
  ANDROIDNDK: /home/runner/android-sdk/ndk/28.0.13004108
  ANDROIDAPI: "35"
  NDKAPI: "24"
  ANDROIDNDKVER: "28c"

steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: "3.11.7"

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install system dependencies
    run: |
      sudo apt-get update

      sudo apt-get install -y \
        git \
        zip \
        unzip \
        wget \
        curl \
        autoconf \
        automake \
        autopoint \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        libtinfo5 \
        cmake \
        libffi-dev \
        libssl-dev \
        build-essential

  - name: Install Python build tools
    run: |
      python -m pip install --upgrade pip setuptools wheel

      python -m pip install \
        "Cython==0.29.36" \
        "buildozer==1.5.0"

  - name: Install Android SDK and NDK
    run: |
      set -e

      SDK_ROOT="/home/runner/android-sdk"

      mkdir -p "$SDK_ROOT/cmdline-tools"

      cd /tmp

      wget -q \
        https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
        -O commandlinetools.zip

      unzip -q commandlinetools.zip

      mkdir -p "$SDK_ROOT/cmdline-tools/latest"

      mv cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"

      export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

      echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      yes | sdkmanager \
        --sdk_root="$SDK_ROOT" \
        --licenses >/dev/null || true

      sdkmanager \
        --sdk_root="$SDK_ROOT" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;28.0.13004108"

  - name: Verify Android SDK
    run: |
      set -e

      SDK_ROOT="/home/runner/android-sdk"
      NDK_ROOT="/home/runner/android-sdk/ndk/28.0.13004108"

      echo "======================================"
      echo "ANDROID SDK"
      echo "======================================"

      echo "$SDK_ROOT"

      test -d "$SDK_ROOT"

      echo ""
      echo "======================================"
      echo "BUILD TOOLS"
      echo "======================================"

      test -d "$SDK_ROOT/build-tools/35.0.0"

      ls -lah "$SDK_ROOT/build-tools/35.0.0"

      echo ""
      echo "======================================"
      echo "AIDL"
      echo "======================================"

      test -f "$SDK_ROOT/build-tools/35.0.0/aidl"

      "$SDK_ROOT/build-tools/35.0.0/aidl" --version

      echo ""
      echo "======================================"
      echo "ANDROID PLATFORM"
      echo "======================================"

      test -d "$SDK_ROOT/platforms/android-35"

      echo ""
      echo "======================================"
      echo "NDK"
      echo "======================================"

      test -d "$NDK_ROOT"

      ls -lah "$NDK_ROOT"

      cat "$NDK_ROOT/source.properties"

  - name: Configure Buildozer SDK
    run: |
      set -e

      SDK_ROOT="/home/runner/android-sdk"

      mkdir -p /home/runner/.buildozer/android/platform

      rm -rf \
        /home/runner/.buildozer/android/platform/android-sdk

      ln -s \
        "$SDK_ROOT" \
        /home/runner/.buildozer/android/platform/android-sdk

      echo "======================================"
      echo "BUILDODER SDK PATH"
      echo "======================================"

      readlink -f \
        /home/runner/.buildozer/android/platform/android-sdk

      echo ""
      echo "======================================"
      echo "BUILDODER AIDL"
      echo "======================================"

      /home/runner/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl --version

  - name: Check project files
    run: |
      set -e

      test -f main.py
      test -f buildozer.spec
      test -f pdf_generator.py
      test -f resume_data.py
      test -f pdf_preview.py

      echo "Project files OK"

  - name: Clean Buildozer
    run: |
      set -e

      rm -rf .buildozer
      rm -rf bin

      mkdir -p /home/runner/.buildozer/android/platform

      rm -rf \
        /home/runner/.buildozer/android/platform/android-sdk

      ln -s \
        /home/runner/android-sdk \
        /home/runner/.buildozer/android/platform/android-sdk

  - name: Final environment check
    run: |
      set -e

      export ANDROIDSDK="/home/runner/android-sdk"
      export ANDROIDNDK="/home/runner/android-sdk/ndk/28.0.13004108"
      export ANDROIDAPI="35"
      export NDKAPI="24"
      export ANDROIDNDKVER="28c"

      export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$ANDROIDSDK/build-tools/35.0.0:$PATH"

      echo "======================================"
      echo "PYTHON"
      echo "======================================"

      python --version

      echo ""
      echo "======================================"
      echo "BUILDOZER"
      echo "======================================"

      buildozer --version

      echo ""
      echo "======================================"
      echo "CYTHON"
      echo "======================================"

      cython --version

      echo ""
      echo "======================================"
      echo "JAVA"
      echo "======================================"

      java -version

      echo ""
      echo "======================================"
      echo "AIDL"
      echo "======================================"

      aidl --version

      echo ""
      echo "======================================"
      echo "ANDROID VARIABLES"
      echo "======================================"

      echo "ANDROIDSDK=$ANDROIDSDK"
      echo "ANDROIDNDK=$ANDROIDNDK"
      echo "ANDROIDAPI=$ANDROIDAPI"
      echo "NDKAPI=$NDKAPI"
      echo "ANDROIDNDKVER=$ANDROIDNDKVER"

  - name: Build APK
    run: |
      set -e

      export ANDROIDSDK="/home/runner/android-sdk"
      export ANDROIDNDK="/home/runner/android-sdk/ndk/28.0.13004108"
      export ANDROIDAPI="35"
      export NDKAPI="24"
      export ANDROIDNDKVER="28c"

      export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$ANDROIDSDK/build-tools/35.0.0:$PATH"

      buildozer -v android debug

  - name: Show APK
    if: success()
    run: |
      echo "======================================"
      echo "APK FILES"
      echo "======================================"

      ls -lah bin

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: resume-builder-apk
      path: bin/*.apk
      if-no-files-found: error
