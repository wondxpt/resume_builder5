name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROIDSDK: ${{ github.workspace }}/android-sdk
      ANDROIDNDK: ${{ github.workspace }}/android-ndk
      ANDROIDNDKVER: 28c
      ANDROIDAPI: "34"
      NDKAPI: "24"
      PIP_NO_CACHE_DIR: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.7"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            setuptools \
            wheel==0.43.0 \
            cython==0.29.34 \
            virtualenv \
            build \
            toml \
            packaging \
            meson \
            ninja

      - name: Install Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mv cmdline-tools latest

          rm commandlinetools.zip

          mkdir -p "$ANDROID_HOME/tools"

          ln -sfn \
            "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/tools/bin"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Verify Android SDK manager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -f "$ANDROID_HOME/tools/bin/sdkmanager"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aidl"

          echo "Android SDK OK"

      - name: Install Android NDK r28c
        run: |
          mkdir -p "$ANDROIDNDK"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip \
            -O android-ndk-r28c-linux.zip

          unzip -q android-ndk-r28c-linux.zip

          mv android-ndk-r28c "$ANDROIDNDK"

          echo "NDK installed at:"
          echo "$ANDROIDNDK"

          test -f "$ANDROIDNDK/source.properties"

      - name: Verify NDK
        run: |
          cat "$ANDROIDNDK/source.properties"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade \
            buildozer \
            setuptools \
            wheel==0.43.0

      - name: Verify project files
        run: |
          echo "Project files:"
          ls -la

          echo "Checking required files..."

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo "Required files found."

      - name: Verify local ReportLab recipe
        run: |
          if [ -f "p4a-recipes/reportlab/__init__.py" ]; then
            echo "Local ReportLab recipe found."
            cat p4a-recipes/reportlab/__init__.py
          else
            echo "No local ReportLab recipe found."
          fi

      - name: Install Python requirements
        run: |
          python -m pip install \
            kivy==2.3.0 \
            kivymd==1.2.0 \
            reportlab==4.0.9 \
            pillow \
            plyer

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          yes | buildozer android clean || true
          yes | buildozer -v android debug

      - name: List build output
        if: always()
        run: |
          echo "========== BIN =========="
          ls -lah bin || true

          echo "========== BUILD DIRECTORY =========="
          find . -maxdepth 3 -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
