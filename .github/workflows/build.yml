name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROIDSDK: /home/runner/android-sdk
      ANDROIDAPI: "35"
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.7"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            tar \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            gettext \
            patch \
            build-essential

      - name: Verify Java and Python
        run: |
          echo "Java:"
          java -version

          echo "Python:"
          python --version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.6.0"

      - name: Verify project
        run: |
          echo "Project:"
          pwd

          echo "Files:"
          ls -lah

          test -f main.py
          test -f buildozer.spec

          echo "main.py OK"
          echo "buildozer.spec OK"

      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools"

          mv \
            "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDAPI=$ANDROIDAPI"

          echo "sdkmanager:"
          command -v sdkmanager

          echo "AIDL:"
          command -v aidl

          echo "AIDL file:"
          ls -lh "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "SDK build-tools:"
          ls -lah "$ANDROID_HOME/build-tools"

          echo "SDK platforms:"
          ls -lah "$ANDROID_HOME/platforms"

          echo "NDK:"
          ls -lah "$ANDROID_HOME/ndk"

      - name: Verify Cython
        run: |
          python --version
          cython --version

          python -c "import setuptools; print('setuptools:', setuptools.__version__)"
          python -c "import Cython; print('Cython:', Cython.__version__)"
          python -c "import buildozer; print('Buildozer:', buildozer.__version__)"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH"

          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDAPI="35"
          export ANDROIDNDK="$ANDROID_HOME/ndk/28.2.13676358"

          echo "=============================="
          echo "BUILD ENVIRONMENT"
          echo "=============================="

          echo "Java:"
          java -version

          echo "Python:"
          python --version

          echo "Cython:"
          cython --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDNDK=$ANDROIDNDK"

          echo "AIDL:"
          command -v aidl

          echo "=============================="
          echo "BUILDING APK"
          echo "=============================="

          buildozer android debug

      - name: Show APK
        if: success()
        run: |
          echo "APK files:"
          ls -lah bin

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resume-builder-apk
          path: bin/*.apk
          if-no-files-found: error
