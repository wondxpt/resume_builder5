name: Build Resume Builder APK

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake

      - name: Setup Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install Cython==0.29.34
          python -m pip install virtualenv

      - name: Check Buildozer
        run: |
          python --version
          buildozer --version

      - name: Check project
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo "Checking buildozer.spec:"
          test -f buildozer.spec
          cat buildozer.spec

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$ANDROID_HOME/licenses/android-sdk-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$ANDROID_HOME/licenses/android-sdk-license"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            >> "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List APK
        if: always()
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print || true
          ls -lah bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Resume-Builder-APK
          path: bin/*.apk
          if-no-files-found: error
