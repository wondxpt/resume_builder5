name: Build Resume Builder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python 3.11.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.7'


      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import sys; print(sys.version)"


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake


      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"


      - name: Verify Java
        run: |
          java -version
          javac -version


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.34 \
            virtualenv


      - name: Verify Buildozer
        run: |
          python --version
          buildozer --version


      - name: Verify project structure
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== LOCAL REPORTLAB RECIPE ====="
          test -f p4a-recipes/reportlab/__init__.py
          cat p4a-recipes/reportlab/__init__.py

          echo "===== BUILDOZER SPEC ====="
          test -f buildozer.spec
          cat buildozer.spec


      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"

          printf '%s\n' \
          '8933bad161af4178b1185d1a37fbf41ea5269c55' \
          > "$ANDROID_HOME/licenses/android-sdk-license"

          printf '%s\n' \
          'd56f5187479451eabf01fb78af6dfcb131a6481e' \
          >> "$ANDROID_HOME/licenses/android-sdk-license"

          printf '%s\n' \
          '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
          >> "$ANDROID_HOME/licenses/android-sdk-license"


      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin


      - name: Build APK
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          buildozer -v android debug


      - name: Show build output
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin/ || true

          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print || true


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Resume-Builder-APK
          path: bin/*.apk
          if-no-files-found: error
